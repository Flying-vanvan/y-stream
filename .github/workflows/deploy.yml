name: Déploiement Infomaniak

# À chaque push sur main : construit le site (node build.js) puis envoie dist/ par FTPS
# dans le dossier du site sur l'hébergement Infomaniak. Identifiants dans Settings → Secrets → Actions :
#   FTP_HOST      ex. xxxx.ftp.infomaniak.com
#   FTP_USER      utilisateur FTP créé dans le Manager (accès au dossier du site)
#   FTP_PASSWORD  son mot de passe
#   FTP_DIR       dossier du site, ex. /sites/y-stream.fr/  (avec les / de début et de fin)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Construire le site
        run: node build.js
      - name: Accès au back-office
        env:
          BO_TOKEN: ${{ secrets.BO_TOKEN }}
          BO_PASSWORD: ${{ secrets.BO_PASSWORD }}
          BO_EMAIL: ivan@ease-designers.com
        run: node tools/secrets-back-office.js
      - name: Envoyer dist/ chez Infomaniak
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/
          server-dir: ${{ secrets.FTP_DIR }}
          state-name: .ftp-deploy-state.json
          exclude: |
            **/.git*
            **/.git*/**
